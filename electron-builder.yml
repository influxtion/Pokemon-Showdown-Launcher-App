appId: com.influxtion.showdowndesktop
productName: Showdown Desktop
directories:
  output: out/windows
asar: true
beforePack: scripts/verify-practice-package.js
afterPack: scripts/verify-practice-package-after.js
extraResources:
  - from: vendor/laplace/dist
    to: practice
    filter:
      - '**/*'
  - from: scripts/laplace
    to: practice-adapter
    filter:
      - server.cjs
      - runner.py
files:
  - app/**/*
  - renderer/**/*
  - vendor/showdex/LICENSE
  - vendor/showdex/SOURCE.md
  - vendor/showdex/manifest.json
  - '!vendor/showdex/dist/**'
  - '!app/**/*.test.js'
  - '!app/**/tests/**'
win:
  signExecutable: false
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  artifactName: Showdown Desktop Setup ${version}-${arch}.${ext}

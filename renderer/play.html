<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Showdown · Showdown Desktop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="play">
<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="rail-brand">Showdown Desktop</div>
    <div class="rail-nav">
      <a class="nav-item" href="index.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2.5 7.5 8 3l5.5 4.5V13H10V9.5H6V13H2.5z"/></svg>
        Home
      </a>
      <div class="rail-rooms" data-nav="rooms"></div>
      <div class="rail-section"><span>Tools</span></div>
      <a class="nav-item" href="replays.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 2.5h8v11l-4-3-4 3z"/></svg>
        Replay notes
      </a>
      <a class="nav-item" href="practice.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><circle cx="8" cy="8" r="2"/></svg>
        Practice
      </a>
      <a class="nav-item" href="settings.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4.5h3M8.5 4.5h5M2.5 11.5h7M12.5 11.5h1"/><circle cx="7" cy="4.5" r="1.5"/><circle cx="11" cy="11.5" r="1.5"/></svg>
        Settings
      </a>
    </div>
    <div class="rail-foot">
      <div class="rail-user" data-nav="account" hidden><strong data-nav="me"></strong><a href="play.html" data-nav="sign-in" hidden>Sign in</a></div>
      <span>v0.2.0-dev</span>
    </div>
  </nav>

  <div class="main">
    <header class="topbar">
      <div class="room-title">
        <h1 id="room-title">Showdown</h1>
        <span class="tag" id="room-format" hidden></span>
        <span class="faint num" id="room-status" hidden></span>
      </div>
      <div class="topbar-actions">
        <span class="status status--off" id="showdex-status">Showdex: Checking…</span>
        <span class="topbar-sep"></span>
        <a class="btn btn-quiet" id="save-note" href="replays.html?draft=1" hidden>Save replay note</a>
        <button class="btn btn-quiet btn-icon" type="button" data-action="sounds" aria-label="Sound" title="Sound"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M2.5 6.5h2.5l3-2.5v8l-3-2.5H2.5z"/><path d="M10.5 6a3 3 0 0 1 0 4M12.5 4.5a5.5 5.5 0 0 1 0 7"/></svg></button>
        <button class="btn btn-quiet btn-icon" type="button" data-action="options" aria-label="Showdown options" title="Showdown options"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2"/><path d="M8 2v2M8 12v2M2 8h2M12 8h2M3.8 3.8l1.4 1.4M10.8 10.8l1.4 1.4M3.8 12.2l1.4-1.4M10.8 5.2l1.4-1.4"/></svg></button>
      </div>
    </header>

    <main class="content content--flush">
      <div class="client-frame">
        <!-- Loading and disconnected states come from nav.js session updates. -->
        <div class="banner banner--warn banner--bar" id="connection-banner" role="status" aria-live="polite">
          <span id="connection-message">Connecting to Showdown…</span>
          <button class="btn" type="button" id="connection-retry" hidden>Reload client</button>
        </div>
        <div class="banner banner--bar banner--result" id="result-bar" role="status" hidden>
          <span id="result-message"></span>
          <span class="spacer"></span>
          <a class="btn" href="replays.html?draft=1">Save replay note</a>
          <button class="btn" type="button" id="result-close">Close battle</button>
          <button class="btn btn-primary" type="button" id="result-again">Battle again</button>
        </div>
        <div class="client-view">
          Loading Pokémon Showdown…
        </div>
      </div>
    </main>
  </div>
</div>
<script src="play.js"></script>
<script src="nav.js"></script>
<script src="integrations.js"></script>
</body>
</html>
